name: Build artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install create-dmg
      - run: chmod +x scripts/build-mac.sh && scripts/build-mac.sh --arch intel
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-Intel
          path: dist/BetterNanoMidi-Intel.dmg

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install create-dmg
      - run: chmod +x scripts/build-mac.sh && scripts/build-mac.sh --arch arm
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-ARM
          path: dist/BetterNanoMidi-ARM.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: chmod +x scripts/build-lnx.sh && scripts/build-lnx.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/BetterNanoMidi
            dist/BetterNanoMidi.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/build-win.bat
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Better NanoMid.exe

  summary:
    needs: [build-macos-intel, build-macos-arm, build-linux, build-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Summarize artifacts
        run: |
          echo "## Build summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | Artifact |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            hash=$(sha256sum "$file" | cut -d ' ' -f1)
            name=$(basename "$file")
            echo "| $hash | $name |" >> "$GITHUB_STEP_SUMMARY"
          done
